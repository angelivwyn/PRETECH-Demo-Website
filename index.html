<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRETECH Demo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <h1 class="title">Pick the correct items!</h1>

    <div class="items">
      <button class="item-button pan-button" type="button" onclick="Pan()">
        <img src="pan.png" alt="Frying pan" />
      </button>

      <button class="item-button" type="button" onclick="Pot()">
        <img src="choppingboard.png" alt="Chopping board" />
      </button>

      <button class="item-button" type="button" onclick="Spatula()">
        <img src="choppingboard.png" alt="Spatula" />
      </button>
    </div>

    <h2 id="counter">You have 0 things selected</h2>

    <div
      id="chooseAnotherItemPopUp"
      class="alertPopUp"
      style="display: none"
    >
      Please choose another item; this was already selected.
    </div>

    <div id="wrongAnswer" class="wrongAnswer" style="display: none">
      I don't think we should use that...
    </div>

    <div id="Congrats" class="Congrats" style="display: none">
      Congratulations! You have all the materials you need. You may now proceed
      to the next page.
    </div>

    <script>
      let clicks = 0;
      let pan = 0;
      let pot = 0;
      let spatula = 0;

      function showAlert() {
        const popup = document.getElementById("chooseAnotherItemPopUp");
        popup.style.display = "block";

        setTimeout(() => {
          popup.style.display = "none";
        }, 3000);
      }

      function wrongAnswershow() {
        const wrongAnswer = document.getElementById("wrongAnswer");
        wrongAnswer.style.display = "block";

        setTimeout(() => {
          wrongAnswer.style.display = "none";
        }, 2000);
      }

      function updateCounter() {
        document.getElementById("counter").textContent =
          "You have " + clicks + " in cart";
      }

      function Pan() {
        pan++;

        if (pan === 1) {
          clicks++;
          updateCounter();
          checkWin();
        } else {
          showAlert();
        }
      }

      function Pot() {
        pot++;

        if (pot === 1) {
          wrongAnswershow();
        } else {
          showAlert();
        }
      }

      function Spatula() {
        spatula++;

        if (spatula === 1) {
          clicks++;
          updateCounter();
          checkWin();
        } else {
          showAlert();
        }
      }

      function checkWin() {
        if (clicks === 2) {
          setTimeout(() => {
            document.getElementById("Congrats").style.display = "block";
          }, 2000);
        }
      }
    </script>
  </body>
</html>
